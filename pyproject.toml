[project]
name = "detecttrace"
version = "0.1.0.dev0"
description = "Agent assurance for AI SOC agents: compare agent traces with analyst verdicts."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1",
    "pydantic>=2.7",
    "pyyaml>=6",
    "typer>=0.27.2",
]

[project.optional-dependencies]
zstd = [
    "zstandard>=0.22",
]
otel = [
    "opentelemetry-sdk>=1.30,<2",
]

[project.scripts]
detecttrace = "detecttrace.cli:app"

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]  # ruff format owns line length; long messages stay on one line

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
include = ["src", "tests", "scripts"]
extraPaths = ["tests", "scripts/synthetic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts/synthetic"]
addopts = "-m 'not benchmark and not browser'"
# With PYTHONWARNDEFAULTENCODING=1 (set in CI), text I/O without an explicit encoding fails
# on every OS, not just on Windows where the locale default is not UTF-8.
filterwarnings = ["error::EncodingWarning"]
markers = [
    "benchmark: performance gates; run with `uv run pytest -m benchmark`",
    "browser: dashboard checks in a real browser; run by hand with `uv run pytest -m browser`",
]

[dependency-groups]
dev = [
    "opentelemetry-sdk>=1.30,<2",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "types-pyyaml>=6.0.12.20260906",
    "zstandard>=0.22",
]
