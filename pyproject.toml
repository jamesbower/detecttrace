[project]
name = "detecttrace"
version = "0.1.0.dev0"
description = "Agent assurance for AI SOC agents: compare agent traces with analyst verdicts."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "James Bower" }]
keywords = [
    "ai-agents",
    "evaluation",
    "genai",
    "langfuse",
    "llm",
    "observability",
    "opentelemetry",
    "security",
    "soc",
    "tracing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Typing :: Typed",
]
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1",
    "pydantic>=2.7",
    "pyyaml>=6",
    "typer>=0.27.2",
]

[project.optional-dependencies]
zstd = [
    "zstandard>=0.22",
]
otel = [
    "opentelemetry-sdk>=1.30,<2",
]
serve = [
    "fastapi>=0.142.2",
    "uvicorn>=0.54.0",
]

[project.urls]
Homepage = "https://detecttrace.ai"
Source = "https://github.com/jamesbower/detecttrace"
Issues = "https://github.com/jamesbower/detecttrace/issues"
Changelog = "https://github.com/jamesbower/detecttrace/blob/main/CHANGELOG.md"

[project.scripts]
detecttrace = "detecttrace.cli:app"

[build-system]
# Exact, so a release build is reproducible: the sdist and wheel depend on the backend version.
requires = ["uv_build==0.11.33"]
build-backend = "uv_build"

[tool.uv.build-backend]
# The sdist carries only what builds the wheel plus the changelog: no tests, scripts or docs.
source-include = ["CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]  # ruff format owns line length; long messages stay on one line

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
include = ["src", "tests", "scripts"]
extraPaths = ["tests", "scripts/synthetic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts/synthetic"]
addopts = "-m 'not benchmark and not browser and not container'"
# With PYTHONWARNDEFAULTENCODING=1 (set in CI), text I/O without an explicit encoding fails
# on every OS, not just on Windows where the locale default is not UTF-8.
filterwarnings = ["error::EncodingWarning"]
markers = [
    "benchmark: performance gates; run with `uv run pytest -m benchmark`",
    "browser: dashboard checks in a real browser; run by hand with `uv run pytest -m browser`",
    "container: builds and runs the Docker image; run with `uv run pytest -m container`",
]

[dependency-groups]
dev = [
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "opentelemetry-sdk>=1.30,<2",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
    "types-pyyaml>=6.0.12.20260906",
    "uvicorn>=0.54.0",
    "zstandard>=0.22",
]
