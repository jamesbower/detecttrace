# Configuration written by `detecttrace init`. Paths are relative to this file.
# Run `detecttrace check` to build the dashboard.
#
# Found: otlp_jsonl traces, 18 agent runs.
#   case_id: "detecttrace.case_id", found on 18 of 18 agent runs (detecttrace attribute)
#   alert_class: "detecttrace.alert_class", found on 18 of 18 agent runs (detecttrace attribute)
#   verdict: "detecttrace.verdict", found on 18 of 18 agent runs (detecttrace attribute)
#   prompt_version: "detecttrace.prompt_version", found on 18 of 18 agent runs (detecttrace attribute)
#   tool_name: "gen_ai.tool.name", found on 95 of 95 tool calls (default)
#   tool_arguments: "gen_ai.tool.call.arguments", found on 95 of 95 tool calls (default)
#   operation: "gen_ai.operation.name": agent runs "invoke_agent", tool calls "execute_tool" (gen_ai.operation.name)
#
# checklists/impossible_travel.yaml.example is inactive until renamed to .yaml.
# It lists the tools the agent called for "impossible_travel", most called first;
# keep only the calls the playbook requires, then rename it.
traces:
  path: "traces"
  format: "otlp_jsonl"
verdicts:
  path: "verdicts.csv"
label_map:
  "FP": "false_positive"
  # Analyst labels not mapped yet; check reports them as unmapped.
  # Uncomment each and set true_positive, false_positive or benign.
  # "Closed - Benign": ""
  # "Malicious": ""
agent_label_map:
  "Benign": "benign"
  "TP": "true_positive"
checklists: "checklists"
output: "detecttrace-dashboard.html"
# Where each value is read from. Commented keys use their default.
