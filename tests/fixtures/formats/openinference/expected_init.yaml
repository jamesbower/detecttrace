# Configuration written by `detecttrace init`. Paths are relative to this file.
# Run `detecttrace check` to build the dashboard.
#
# Found: otlp_jsonl traces, 201 agent runs.
#   case_id: "soc.case.id" on 201 of 201 agent runs (suffix match)
#   alert_class: "soc.alert.class" on 201 of 201 agent runs (suffix match)
#   verdict: "soc.agent.verdict" on 201 of 201 agent runs (suffix match)
#   prompt_version: "soc.prompt.version" on 201 of 201 agent runs (suffix match)
#   tool_name: "tool.name" on 1,059 of 1,059 tool calls (OpenInference)
#   tool_arguments: "input.value" on 1,059 of 1,059 tool calls (OpenInference)
#   operation: "openinference.span.kind": agent runs "AGENT", tool calls "TOOL" (OpenInference)
#
# checklists/impossible_travel.yaml.example is inactive until renamed to .yaml.
# It lists the tools the agent called for "impossible_travel", most called first;
# keep only the calls the playbook requires, then rename it.
traces:
  path: "traces"
  format: "otlp_jsonl"
verdicts:
  path: "verdicts.csv"
label_map:
  "FP": "false_positive"
  "TP": "true_positive"
  # Analyst labels not mapped yet; check reports them as unmapped.
  # Uncomment each and set true_positive, false_positive or benign.
  # "Closed - Benign": ""
  # "Malicious": ""
agent_label_map:
  "Benign": "benign"
checklists: "checklists"
output: "detecttrace-dashboard.html"
# Where each value is read from. Commented keys use their default.
mapping:
  case_id: "soc.case.id"
  alert_class: "soc.alert.class"
  verdict: "soc.agent.verdict"
  prompt_version: "soc.prompt.version"
  # prompt_version_lookup: "root_then_resource"
  tool_name: "tool.name"
  tool_arguments: "input.value"
  operation:
    attribute: "openinference.span.kind"
    agent_value: "AGENT"
    tool_value: "TOOL"
    # span_name_fallback: true
--- # checklists/impossible_travel.yaml.example
# Example checklist written by `detecttrace init`. It is inactive until renamed to impossible_travel.yaml.
# It lists the tools the agent called for this alert class, most called first, so as written
# it would score close to 100% evidence completeness. Keep only the calls the playbook
# requires, add argument rules where a call must cover a range or a value, then rename.
alert_class: "impossible_travel"
items:
  - id: "get_user_locations"
    tool: "get_user_locations"
  - id: "get_ip_reputation"
    tool: "get_ip_reputation"
  - id: "get_signin_logs"
    tool: "get_signin_logs"
  - id: "query_sentinel"
    tool: "query_sentinel"
  - id: "get_user_profile"
    tool: "get_user_profile"
  - id: "check_mfa_status"
    tool: "check_mfa_status"
