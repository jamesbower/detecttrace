# Receives OTLP/HTTP on 4318 and forwards every batch to record.py twice:
# once as JSON and once as protobuf. host.docker.internal is the Docker
# Desktop name for the host machine.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s

exporters:
  otlphttp/json:
    traces_endpoint: http://host.docker.internal:18080/json/v1/traces
    encoding: json
    headers:
      Authorization: Bearer capture-not-a-secret
  otlphttp/proto:
    traces_endpoint: http://host.docker.internal:18080/proto/v1/traces

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/json, otlphttp/proto]
